<title>NECTEC Co-op Systems</title>

<style>
:root{
  --bg:#e9eff6; --ink:#101820; --muted:#5a6672; --line:#dce2e8; --soft:#f2f5f7; --paper:#fff;
  --nc:#2563eb; --glass:rgba(255,255,255,.82); --edge:rgba(16,24,32,.1);
  --display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --pw:min(540px,max(420px,38vw)); --hh:58px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--nc);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
#stage{position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 70% at 30% 35%,#ffffff 0%,rgba(255,255,255,0) 70%),
  linear-gradient(180deg,#f3f7fb 0%,#dfe8f2 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing} #gl.pick{cursor:pointer}
#labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}

/* ---- labels in 3D ---- */
.nl{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid var(--edge);background:rgba(255,255,255,.94);border-radius:10px;padding:.2em .6em .24em;
  text-align:center;line-height:1.2;white-space:nowrap;opacity:0;will-change:transform,opacity;box-shadow:0 6px 18px -8px rgba(16,24,32,.35);transition:border-color .2s,background .2s,box-shadow .2s}
.nl b{display:block;font-family:var(--display);font-weight:600;font-size:.86rem;color:var(--ink)}
.nl small{display:block;font-size:.66rem;color:var(--muted)}
.nl i{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--c);margin-right:.4em;vertical-align:.05em}
.nl:hover,.nl.hot{border-color:var(--c)}
.nl.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent),0 10px 24px -8px rgba(16,24,32,.4)}
.nl.star b{color:var(--c)}
.nl.dim b,.nl.dim small{opacity:.6}
.zl{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;color:var(--c);opacity:0;white-space:nowrap;font-weight:500}
.ll{position:absolute;left:0;top:0;pointer-events:none;font-size:.66rem;background:rgba(255,255,255,.92);border:1px solid var(--edge);border-radius:999px;padding:0 .55em;color:var(--muted);opacity:0;white-space:nowrap}
.il{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid var(--edge);background:rgba(255,255,255,.95);border-radius:16px;padding:.45em 1.1em .5em;text-align:center;opacity:0;white-space:nowrap;
  box-shadow:0 14px 34px -12px rgba(16,24,32,.45);transition:transform .0s,border-color .2s,box-shadow .25s}
.il b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1.2;color:var(--c)}
.il small{display:block;font-size:.76rem;color:var(--muted)}
.il:hover{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent),0 14px 34px -12px rgba(16,24,32,.45)}
.il.core b{color:#2563eb}

/* ---- header ---- */
#hud{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:6;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(180deg,rgba(243,247,251,.95),rgba(243,247,251,0))}
#brand{color:var(--muted);white-space:nowrap}
#brand b{color:var(--ink);font-weight:600}
#tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:auto;padding:4px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:.38em 1.05em;font-family:var(--display);font-weight:600;font-size:.95rem;
  display:flex;gap:.5em;align-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
.tab::before{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--c)}
.tab:hover{border-color:var(--c);transform:translateY(-1px)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#stepc{color:var(--muted);min-width:5em;text-align:right}
#prog{position:fixed;left:0;top:0;height:3px;width:100%;z-index:7;pointer-events:none}
#prog i{display:block;height:100%;width:0;background:var(--nc);transition:width .6s var(--ease),background .5s}

/* ---- right panel ---- */
#panel{position:fixed;z-index:7;right:14px;top:calc(var(--hh) + 2px);bottom:14px;width:var(--pw);background:rgba(255,255,255,.97);border-radius:20px;
  box-shadow:0 26px 70px -18px rgba(16,24,32,.45),0 0 0 1px rgba(16,24,32,.06);display:flex;flex-direction:column;min-width:0;overflow:hidden}
#panel::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--nc);transition:background .5s}
#phead{padding:16px 22px 6px}
#pk{color:var(--nc);font-weight:500}
#pt{font-family:var(--display);font-size:1.5rem;line-height:1.2;margin:.1em 0 0;text-wrap:balance}
#snav{display:flex;gap:6px;overflow-x:auto;padding:8px 22px 10px;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.sp{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.22em .8em;font-size:.84rem;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.sp:hover{border-color:var(--nc);color:var(--nc)}
.sp[aria-selected="true"]{background:var(--nc);border-color:var(--nc);color:#fff;font-weight:600}
#body{padding:14px 22px 18px;overflow-y:auto;min-height:0;flex:1;scrollbar-width:thin;overscroll-behavior:contain}
#foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--soft)}
.nb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.35em 1em;font-family:var(--display);font-weight:600;font-size:.9rem;display:flex;gap:.5em;align-items:center;max-width:46%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nb:hover{border-color:var(--nc);color:var(--nc)}
.nb:disabled{opacity:.35;pointer-events:none}
.nb.pri{background:var(--ink);border-color:var(--ink);color:#fff;margin-left:auto}
.nb.pri:hover{background:var(--nc);border-color:var(--nc);color:#fff}
#hintk{color:var(--muted);flex:1;text-align:center;font-size:.64rem}

/* ---- diagram overlays ---- */
#card{position:fixed;z-index:6;left:16px;top:calc(var(--hh) + 8px);width:min(380px,calc(100vw - var(--pw) - 48px));max-height:calc(100vh - var(--hh) - 190px);overflow:auto;
  background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 20px 50px -16px rgba(16,24,32,.5),0 0 0 1px rgba(16,24,32,.06);padding:14px 18px 8px;
  transition:opacity .4s var(--ease),transform .5s var(--ease)}
#card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc,var(--nc))}
#card[hidden]{display:block!important;opacity:0;transform:translateX(-24px) scale(.97);pointer-events:none}
#cclose{position:absolute;right:8px;top:8px;border:1px solid var(--line);background:#fff;border-radius:999px;width:1.9em;height:1.9em;line-height:1;color:var(--muted)}
#cclose:hover{border-color:var(--nc);color:var(--nc)}
#ck{color:var(--cc,var(--nc));font-weight:500}
#ct{font-family:var(--display);font-size:1.2rem;margin:.1em 1.6em .3em 0;line-height:1.25}
#flowbar{position:fixed;z-index:6;left:16px;bottom:16px;width:min(560px,calc(100vw - var(--pw) - 48px));background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-radius:16px;box-shadow:0 14px 40px -14px rgba(16,24,32,.45),0 0 0 1px rgba(16,24,32,.07);padding:10px 12px;display:flex;flex-direction:column;gap:8px;
  transition:opacity .45s var(--ease),transform .5s var(--ease)}
#flowbar[hidden]{display:flex!important;opacity:0;transform:translateY(24px);pointer-events:none}
#fchips{display:flex;gap:6px;flex-wrap:wrap}
.fc{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.15em .75em;font-size:.82rem;font-weight:600;font-family:var(--display)}
.fc[aria-pressed="true"]{background:var(--nc);border-color:var(--nc);color:#fff}
#fcap{display:flex;gap:10px;align-items:flex-start;min-height:3em}
#fn{flex:none;background:var(--nc);color:#fff;border-radius:8px;padding:0 .55em;font-family:var(--mono);font-size:.75rem;margin-top:.25em}
#ft{font-size:.95rem;line-height:1.45}
#fctl{display:flex;gap:6px;align-items:center}
.fb{border:1px solid var(--line);background:#fff;border-radius:999px;width:2.3em;height:2.3em;font-size:.95rem;line-height:1;display:grid;place-items:center}
.fb:hover{border-color:var(--nc);color:var(--nc)}
.fb.play{background:var(--nc);border-color:var(--nc);color:#fff;width:auto;padding:0 1em;gap:.4em;display:flex;font-family:var(--display);font-weight:600}
#fhint{color:var(--muted);margin-left:auto;font-size:.62rem}
#reset{position:fixed;z-index:6;left:16px;top:calc(var(--hh) + 8px);transition:left .3s}
.tb{border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:.25em .9em;font-size:.8rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tb:hover{border-color:var(--nc);color:var(--nc)}
body[data-card="1"] #reset{left:calc(min(380px,100vw - var(--pw) - 48px) + 28px)}
#vhint{position:fixed;z-index:5;left:50%;bottom:22px;transform:translateX(calc(-50% - var(--pw)/2));color:var(--muted);background:var(--glass);border-radius:999px;padding:.25em 1em;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .4s;pointer-events:none;box-shadow:0 0 0 1px var(--edge)}
body[data-island="1"] #vhint{opacity:0}
#foot .mono{color:var(--muted);margin-right:4px}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.2em .75em;font-size:.82rem;font-family:var(--display);font-weight:600;color:var(--ink)}
.fchip:hover{border-color:var(--nc);color:var(--nc)}
.rich h3{font-family:var(--display);font-size:1.15rem;margin:.2em 0 .55em;text-wrap:balance;line-height:1.3}
.rich h4{font-family:var(--display);font-size:.98rem;margin:1.1em 0 .3em;color:var(--nc)}
.rich p{margin:0 0 .8em;max-width:64ch}
.rich ul,.rich ol{margin:0 0 .9em;padding-left:1.2em}
.rich li{margin:.22em 0}
.rich code{font-family:var(--mono);font-size:.84em;background:var(--soft);padding:.05em .35em;border-radius:4px;word-break:break-word}
.rich p.hint{color:var(--muted);font-size:.86rem}
.rich .mono{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.4em 1em;margin:0 0 1em}
.kv dt{color:var(--muted);font-size:.86rem}
.kv dd{margin:0;font-weight:500;min-width:0}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:0 0 1em}
.nums div{background:var(--soft);border-radius:12px;padding:.7em .8em}
.nums b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1;color:var(--nc);font-variant-numeric:tabular-nums}
.nums span{font-size:.8rem;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 1em;font-size:.84rem}
.flow i{font-style:normal;border:1px solid var(--line);border-radius:8px;padding:.3em .6em;background:var(--soft)}
.flow i.a{border-color:var(--nc);background:color-mix(in srgb,var(--nc) 10%,#fff);color:var(--nc);font-weight:600}
.flow u{text-decoration:none;color:var(--muted)}
.ps{display:grid;gap:8px;margin:0 0 1em}
.ps>div{border:1px solid var(--line);border-radius:12px;padding:.6em .8em}
.ps b{display:block;font-size:.92rem}
.ps span{font-size:.88rem;color:var(--muted)}
.ps span::before{content:"→ ";color:var(--nc)}
.tw{overflow-x:auto;margin:0 0 1em}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:.45em .6em;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.78rem}
td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.st{display:inline-block;border-radius:999px;padding:0 .55em;font-size:.76rem;font-weight:600;background:color-mix(in srgb,var(--nc) 12%,#fff);color:var(--nc);white-space:nowrap}
.st.w{background:#fff4dc;color:#a86a00}.st.g{background:var(--soft);color:var(--muted)}
.bars{display:grid;gap:6px;margin:0 0 1em}
.bars div{display:grid;grid-template-columns:8.5em 1fr 3.2em;gap:8px;align-items:center;font-size:.84rem}
.bars s{display:block;height:14px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden}
.bars s::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--nc);border-radius:4px;animation:grow 1s var(--ease) .35s backwards}
.bars s.w::after{background:#d98a1c}
@keyframes grow{from{width:0}}
.bars em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right}
.note{background:#fff4dc;color:#5c3b00;border-radius:10px;padding:.55em .8em;font-size:.86rem;margin:0 0 1em}
.me{border-left:3px solid var(--nc);background:color-mix(in srgb,var(--nc) 9%,#fff);padding:.55em .8em;border-radius:0 10px 10px 0;margin:0 0 1em;font-size:.92rem}
.me b{color:var(--nc)}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 1em}
.swot>div{border:1px solid var(--line);border-radius:12px;padding:.6em .8em;font-size:.86rem;min-width:0}
.swot b{font-family:var(--display);color:var(--nc);display:block;margin-bottom:.2em}
.swot ul{margin:0;padding-left:1.1em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 1em}
.card{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:.7em .85em;transition:border-color .2s,transform .3s var(--ease),box-shadow .3s}
.card:hover{border-color:var(--nc);transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(0,0,0,.3)}
.card b{display:block;font-family:var(--display);color:var(--nc)}
.card span{font-size:.84rem;color:var(--muted);line-height:1.4;display:block}
.ph{margin:0 0 1em}
.ph img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:var(--soft);transition:transform .4s var(--ease),box-shadow .4s}
.ph img:hover{transform:scale(1.012);box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.ph figcaption{font-size:.8rem;color:var(--muted);margin-top:.35em;line-height:1.4}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0 0 1em}
.gal .ph{margin:0}
.rich h3{margin-top:0}
.rich hr{border:0;border-top:1px dashed var(--line);margin:1.3em 0}
/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;z-index:30;background:rgba(16,24,32,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s}
#lb.on{opacity:1;pointer-events:auto}
#lb img{max-width:min(96vw,1500px);max-height:80vh;border-radius:12px;background:#fff;transform:scale(.9);transition:transform .5s var(--ease);box-shadow:0 30px 90px -10px #000}
#lb.on img{transform:none}
#lb p{margin:0;color:#cbd5e1;max-width:70ch;text-align:center;font-size:.9rem}
@media (max-width:820px){
  :root{--hh:52px}
  #brand,#stepc,#hintk{display:none}
  #panel{left:8px;right:8px;width:auto;top:auto;height:50vh;bottom:8px}
  #card{left:8px;width:calc(100vw - 16px);max-height:27vh;top:auto;bottom:calc(50vh + 16px)}
  body[data-card="1"] #flowbar{opacity:0!important;pointer-events:none!important}
  #flowbar{left:8px;width:calc(100vw - 16px);bottom:calc(50vh + 16px);padding:8px 10px;gap:6px}
  #fhint{display:none}
  #ft{font-size:.86rem}
  #reset{display:none}
  #vhint{display:none}
  #pt{font-size:1.25rem}
  .swot{grid-template-columns:1fr}
  .bars div{grid-template-columns:6.5em 1fr 3em}
  .nl b{font-size:.74rem}.nl small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

</style>

<div id="stage"><canvas id="gl" aria-label="แผนภาพสถาปัตยกรรม 3 มิติ คลิกกล่องเพื่อดูรายละเอียด ลากเพื่อหมุน"></canvas><div id="labels"></div></div>
<div id="prog"><i></i></div>
<header id="hud">
  <span id="brand" class="mono"><b>NECTEC</b> · CO-OP 3/2568</span>
  <nav id="tabs" role="tablist" aria-label="หัวข้อ"></nav>
  <span id="stepc" class="mono"></span>

${scr('at-emp.png','8 · จัดการรายชื่อพนักงาน','หน้าจัดการรายชื่อพนักงาน','เพิ่ม แก้ไข กำหนดสิทธิ์ และเปิดหรือปิดการใช้งานบัญชี','ช่องค้นหาและตัวกรองหน่วยงาน ระดับสิทธิ์ สถานะ · ตารางรหัส ชื่อ-ตำแหน่ง หน่วยงาน สิทธิ์ระบบ (พนักงาน, Admin หน่วยงาน, Admin สูงสุด) สถานะ · ปุ่ม “แก้ไข” “สิทธิ์” “ปิดใช้งาน”')}

${scr('at-audit.png','10 · ประวัติการดำเนินการ (Audit Log)','แท็บประวัติการดำเนินการของผู้ดูแลระบบ','ตรวจย้อนหลังว่าใครทำอะไรกับบัญชีใครและเมื่อใด','คำอธิบายว่าแสดง 50 รายการล่าสุด · ตาราง วัน-เวลา ผู้ดำเนินการ การกระทำ (เปิดใช้งาน/ปิดใช้งาน) พนักงานเป้าหมาย รายละเอียด · ข้อมูลในภาพเกิดจากการทดสอบระบบ')}`},{id:'at-arch',k:'AtTime · 05',t:'สถาปัตยกรรม',camDist:25,flow:1,
h:`<h3>ทุกคำขอผ่าน nginx ก่อนถึง backend</h3>
<div class="flow"><i>LINE</i><u>→</u><i>nginx</i><u>→</u><i>frontend</i><u>→</u><i class="a">FastAPI</i><u>→</u><i>PostgreSQL</i><u>+</u><i>รูป (bind mount)</i></div>
<div class="note">ในแผนภาพ 3 มิติทางซ้าย คลิกกล่องเพื่อดูหน้าที่และมาตรการความปลอดภัย หรือกด ▶ เล่นเส้นทาง เพื่อดูคำขอเดินทางผ่านระบบทีละขั้น</div>
<dl class="kv"><dt>Backend</dt><dd>Python 3.12, FastAPI</dd><dt>Frontend</dt><dd>Vite เสิร์ฟด้วย nginx ในแต่ละ container</dd><dt>ฐานข้อมูล</dt><dd>PostgreSQL 16 (6 ตาราง)</dd><dt>รวม</dt><dd>7 container</dd></dl>`,

kids:[
{id:'a-line',k:'ภายนอก',t:'LINE + LIFF',lid:'line',h:`<h3>พนักงานเปิดเว็บแอปใน LINE</h3>
<p>LIFF ให้ <b>access token</b> ของผู้ใช้ที่ล็อกอิน LINE อยู่ แล้วส่งไปกับคำขอเพื่อให้ backend พิสูจน์ได้ว่าใครเป็นใคร ไม่ต้องเชื่อรหัสผู้ใช้ที่ฝั่งมือถือส่งมาเอง</p>
<div class="me"><b>มุมความปลอดภัย</b> ฝั่ง client ควบคุมไม่ได้ จึงต้องตรวจซ้ำที่ server</div>`},
{id:'a-nginx',k:'ด่านหน้า',t:'nginx',lid:'nginx',h:`<h3>reverse proxy แยกโดเมนไปแต่ละ frontend และ backend</h3>
<ul><li>HTML ทุกหน้าตั้ง <code>Cache-Control: no-cache</code> เพื่อให้ WebView ใน LINE ไม่ค้างโค้ดเก่า</li><li>ไฟล์ <code>/assets/</code> ที่มี hash ในชื่อแคชได้ 1 ปี (<code>immutable</code>)</li><li><b>ไม่เปิด route ไปยังโฟลเดอร์รูปใบหน้า</b> เพราะเป็นข้อมูลชีวมิติ</li></ul>`},
{id:'a-fa',k:'Frontend',t:'attendance',lid:'fa',side:'r',h:`<h3>หน้าที่พนักงานใช้ใน LINE</h3>
<p>สแกนเวลา ดูประวัติ (<code>history.html</code>) และลงทะเบียนใบหน้า (face-enroll)</p>
<ul><li>หน้าประวัติส่ง header <code>X-LIFF-Access-Token</code> ไปให้ backend ตรวจ</li><li>ถ้าได้ 401 จะเรียก <code>liff.login</code> ไม่เกิน 1 ครั้งต่อการโหลดหน้า เพื่อกัน redirect loop</li></ul>`},
{id:'a-fd',k:'Frontend',t:'dashboard',lid:'fd',side:'r',h:`<h3>หน้าของผู้ดูแลระบบ</h3>
<ul><li>เข้าสู่ระบบด้วย <b>JWT</b> แยกบทบาท <code>super_admin</code> และ <code>dept_admin</code></li><li>ดึงรูปตอนลงทะเบียนด้วย <code>authFetch</code> แล้วแสดงเป็น blob URL และ revoke เมื่อปิดหน้าต่าง</li><li>แท็บ <b>ประวัติการดำเนินการ</b> แสดง Audit Log ของผู้ดูแล</li></ul>`},
{id:'a-fr',k:'Frontend',t:'register',lid:'fr',side:'r',h:`<h3>หน้าลงทะเบียนพนักงาน</h3><p>กรอกข้อมูลพื้นฐาน บัญชีที่ถูกปิดใช้งานจะลงทะเบียนซ้ำเพื่อเปิดบัญชีคืนไม่ได้ (ตอบ 403)</p>`},
{id:'a-fp',k:'Frontend · ไม่เปิดภายนอก',t:'profile',lid:'fp',side:'r',dim:1,h:`<h3>container ที่มีอยู่ แต่ไม่มีทางเข้าจากภายนอก</h3><p>รันที่พอร์ตภายใน 3102 ไม่มี route จาก nginx และผมไม่ได้แก้ส่วนนี้</p><div class="me"><b>มุมความปลอดภัย</b> พื้นผิวโจมตีที่ไม่ได้เปิด ย่อมโจมตีจากภายนอกไม่ได้</div>`},
{id:'a-be',k:'หัวใจของระบบ',t:'FastAPI backend',lid:'be',h:`<h3>จุดเดียวที่ตัดสินใจเรื่องสิทธิ์และตรวจใบหน้า</h3>
<ul><li>Python 3.12 บน uvicorn ตรวจใบหน้าด้วย face embedding และ anti-spoofing</li><li>ตรวจ <b>LIFF token</b> กับ LINE ก่อนส่งประวัติให้ ถ้าไม่ตรงคนตอบ <code>403</code></li><li>บัญชี <code>is_active=false</code> ตอบ 403 พร้อมข้อความไทยทุก endpoint ที่แก้ข้อมูล</li><li>บันทึก Audit Log ลง <code>admin_audit_log</code></li></ul>
<div class="note">ยังเปิดอยู่: endpoint สแกน ลงทะเบียนใบหน้า และผูกอุปกรณ์ ยังเชื่อรหัสผู้ใช้จากฝั่ง client เสนอเป็นงานรอบถัดไป</div>`},
{id:'a-pg',k:'ข้อมูล',t:'PostgreSQL 16',lid:'pg',h:`<h3>ฐานข้อมูลพนักงานและเวลา</h3><p>มี 6 ตาราง รวมพนักงาน บันทึกเวลา และ <code>admin_audit_log</code> ทุกรอบ deploy สำรองด้วย <code>pg_dump</code> ก่อนและตรวจไฟล์สำรองก่อนลงมือ</p>`},
{id:'a-ph',k:'ข้อมูลชีวมิติ',t:'โฟลเดอร์รูป',lid:'ph',h:`<h3>3 โฟลเดอร์แบบ bind mount ลงดิสก์ของ host</h3>
<ul><li>รูปสแกน รูปพนักงาน และรูปลงทะเบียน 5 ท่าต่อคน</li><li>PR #6 ผูก volume ให้โฟลเดอร์ลงทะเบียน เพราะเดิมรูปเขียนอยู่ใน container แล้วหายเมื่อสร้างใหม่</li><li>ไม่เป็น static route ดูได้ผ่าน endpoint ที่ต้อง JWT เท่านั้น</li></ul>`},
{id:'a-lp',k:'ภายนอก',t:'LINE Platform',lid:'lp',h:`<h3>ผู้ตรวจ access token</h3><p>backend เรียก LINE ตรวจ token โดยต้องมี <code>client_id</code> ตรงกับ channel ที่อนุญาต และ <code>expires_in &gt; 0</code> มีแคช 5 นาทีและ timeout 4 วินาที ถ้าตรวจล้มเหลวในระยะแรกจะถอยกลับเส้นทางเดิมเพื่อไม่ให้หน้าล่ม</p>`}
]},
{id:'at-fix',k:'AtTime · 06',t:'ปัญหา → ทางแก้',h:`<h3>5 ปัญหาที่ปิดไปในช่วง 2–6 ต.ค.</h3>
<div class="ps"><div><b>LINE แคชหน้าเว็บเก่า ผู้ใช้ไม่ได้โค้ดล่าสุด</b><span>ตั้ง nginx ให้ HTML เป็น <code>no-cache</code> ส่วนไฟล์ที่มี hash แคชได้ 1 ปี</span></div>
<div><b>บัญชีที่ถูกปิดยังสแกนและดูประวัติได้</b><span>ตอบ 403 พร้อมข้อความไทยในทุก endpoint ที่เกี่ยวข้อง และกันการลงทะเบียนซ้ำเพื่อเปิดบัญชีคืน</span></div>
<div><b>หน้าประวัติเปิดดูของคนอื่นได้ถ้ารู้รหัสผู้ใช้ (IDOR)</b><span>backend ตรวจ LIFF token กับ LINE ว่าเป็นเจ้าของบัญชีจริง คนละคนตอบ 403</span></div>
<div><b>log ของการตรวจ token ไม่ขึ้น</b><span>พบว่าไม่เคยตั้งค่า logging จึงเพิ่ม handler เฉพาะ logger ที่ต้องใช้</span></div>
<div><b>Dashboard ไม่แสดงรูปตอนลงทะเบียน</b><span>เพิ่ม endpoint รูปที่ต้องล็อกอินและจำกัดตามหน่วยงาน</span></div></div>`},
{id:'at-sec',k:'AtTime · 07',t:'ความปลอดภัย',h:`<h3>ออกแบบโดยคิดแบบผู้โจมตี</h3>
<div class="tw"><table><tr><th>จุด</th><th>มาตรการ</th></tr>
<tr><td>หน้าประวัติ (IDOR)</td><td>ตรวจ LIFF token กับ LINE เปิดใช้เป็น 2 ระยะ ระยะแรกยังถอยไปเส้นทางเดิมได้ และจำกัดฟิลด์ ไม่ส่ง GPS รูป และ role</td></tr>
<tr><td>รูปใบหน้า (ข้อมูลชีวมิติ)</td><td>ต้องมี JWT · dept_admin ข้ามหน่วยงานได้ 403 · กัน path traversal 2 ชั้น · <code>Cache-Control: no-store</code> · ไม่เปิดเป็น static route · ไม่บันทึก path ลง log</td></tr>
<tr><td>บัญชีปิดใช้งาน</td><td>403 ที่การสแกน ลงทะเบียนใบหน้า ผูกอุปกรณ์ และดูประวัติ</td></tr>
<tr><td>การกระทำของผู้ดูแล</td><td>Audit Log ในตาราง <code>admin_audit_log</code> และแท็บในหน้า Dashboard</td></tr></table></div>
<div class="note">ยังเปิดอยู่: endpoint สแกน ลงทะเบียนใบหน้า และผูกอุปกรณ์ ยังเชื่อรหัสผู้ใช้จากฝั่ง client และระยะสองของ LIFF ยังไม่ได้เปิด จึงยังไม่ควรบอกว่าระบบปลอดภัยครบ</div>`},
{id:'at-deploy',k:'AtTime · 08',t:'Deploy',h:`<h3>ทุกรอบสำรองก่อน และถอยกลับได้</h3>
<div class="flow"><i>A · เตรียม .env</i><u>→</u><i>B · สำรอง DB + รูป, ติดแท็ก image, build</i><u>→</u><i class="a">C · สลับเฉพาะ container ที่เปลี่ยน</i><u>→</u><i>ทดสอบ</i></div>
<ul><li>สำรองฐานข้อมูลด้วย <code>pg_dump</code> และรูป 3 โฟลเดอร์ ก่อนทุกรอบ</li><li>ติดแท็ก image เดิมเป็นจุดถอยกลับ แล้วใช้ <code>--no-deps</code> เพื่อไม่ให้ฐานข้อมูลและ nginx ถูกรีสตาร์ท</li><li>แผนถอยกลับถูกใช้จริงหนึ่งครั้งจากการวางคำสั่งพลาด กู้คืนได้ในไม่กี่นาที ไม่มีข้อมูลเสียหาย</li></ul>
<div class="nums"><div><b data-count="275">275</b><span>รูปคงที่ก่อนและหลัง deploy</span></div><div><b data-count="2">2</b><span>รอบ deploy ล่าสุด (PR #9, #10)</span></div></div>`},
{id:'at-test',k:'AtTime · 09',t:'ผลทดสอบ',h:`<h3>ทดสอบบนเครื่อง local 18 เคส แล้วยืนยันบนเซิร์ฟเวอร์จริง</h3>
<div class="tw"><table><tr><th>รายการ</th><th>ผลบนเซิร์ฟเวอร์</th><th></th></tr>
<tr><td>Backend หลัง deploy</td><td>เริ่มทำงานปกติ ไม่มี error</td><td><span class="st">ผ่าน</span></td></tr>
<tr><td>nginx no-cache</td><td>หน้าประวัติตอบ <code>no-cache</code></td><td><span class="st">ผ่าน</span></td></tr>
<tr><td>บล็อกบัญชีปิดใช้งาน</td><td>ปิดบัญชีแล้วสแกนไม่ผ่าน เปิดคืนแล้วใช้ได้ปกติ</td><td><span class="st">ผ่าน</span></td></tr>
<tr><td>LIFF token ระยะแรก</td><td>log ขึ้น <code>LIFF_VERIFIED</code></td><td><span class="st w">ผ่าน (มือถือเครื่องเดียว)</span></td></tr>
<tr><td>รูปลงทะเบียนใน Dashboard</td><td>แสดงรูปแทนไอคอน ไม่ค้างรูปคนก่อนหน้า</td><td><span class="st">ผ่าน</span></td></tr>
<tr><td>endpoint รูปโดยไม่ล็อกอิน</td><td>401</td><td><span class="st">ผ่าน</span></td></tr>
<tr><td>dept_admin เปิดรูปข้ามหน่วยงาน</td><td>ตรวจในโค้ดแล้ว ยังไม่ได้ทดสอบบนเซิร์ฟเวอร์</td><td><span class="st g">ยังไม่ทดสอบ</span></td></tr></table></div>`},
{id:'at-learn',k:'AtTime · 10',t:'บทเรียน',h:`<h3>สิ่งที่ได้จากการดูแลระบบจริง</h3>
<ul><li>ตรวจ diff ก่อน merge พบ 2 จุดที่โค้ดแก้เกินขอบเขต จึงแก้กลับก่อนขึ้นระบบ</li><li>รูปลงทะเบียนเดิมเคยหายเพราะโฟลเดอร์ไม่ได้ผูก volume จึงสำรองรูปและตรวจ mount ทุกครั้ง</li><li>log ต้องเห็นจริงก่อนเชื่อว่าระบบทำงานตามที่ออกแบบ</li><li>รันคำสั่งทีละบล็อก และแยกคำสั่งอ่านอย่างเดียวออกจากคำสั่งแก้ไข</li></ul>`}
]},

/* ---------- 3 AINTEC ---------- */
{id:'aintec',k:'งานวิจัย · AINTEC 2026',t:'AINTEC 2026',lbl:'AINTEC 2026',col:'#a493ff',dark:'#5b45d6',pos:[13,5.5,3],big:1,
h:`<h3>ถ้าเครือข่ายไปยัง LLM มีปัญหา งานของ AI agent ยังเสร็จไหม</h3>
<p>บทความวิจัยที่ส่ง AINTEC 2026 วัดความน่าเชื่อถือของ agentic LLM workflow เมื่อเครือข่ายระหว่าง agent กับ model server ถูกบีบด้วย delay, packet loss, jitter และ bandwidth</p>

<h4>กราฟนี้คืออะไร</h4>
<p>กราฟเทียบ <b>อัตราที่ workflow ทำงานสำเร็จ (completion)</b> กับ <b>ระดับ packet loss ที่ตั้งไว้</b> เพื่อหาว่าเครือข่ายแย่ขนาดไหนระบบถึงเริ่มพัง ทุกจุดมาจากการรันซ้ำ 20 ครั้ง และเส้นแท่งตั้งคือช่วงความเชื่อมั่น ซึ่งกว้างเพราะจำนวนรอบต่อจุดไม่มาก</p>
<h4>อ่านอย่างไร ใน 3 ขั้น</h4>
<ol><li>แกนนอนคือ packet loss ที่ตั้งไว้ (%) แกนตั้งซ้ายคือ completion (%) ยิ่งสูงยิ่งดี</li><li>ดูว่าเส้นยังราบที่ 100% ถึงจุดไหน แล้วเริ่มตกที่ไหน คือ <b>จุดหักของระบบ</b></li><li>ดูแถบสีเพื่อหาช่วง degradation และเทียบกับกราฟช่องอื่นว่าผลทำซ้ำได้หรือไม่</li></ol>
<h4>บอกอะไร</h4>
<p>ระบบทนได้เกือบทุกระดับ จนถึงราว 65% จากนั้นตกอย่างรวดเร็วที่ 70–75% ไม่ได้ค่อย ๆ แย่ลง และ error ใน log ขยับขึ้นก่อน completion จะตก จึงใช้เป็นสัญญาณเตือนล่วงหน้าได้ ส่วนจุดหักเลื่อนได้ตามช่วงเวลาที่เก็บข้อมูล</p>
<h4>ถ้าเอาไปใช้</h4>
<ul><li>ตั้ง timeout และงบ retry ให้มีส่วนเผื่อก่อนถึงจุดหัก ไม่ใช้ค่าเฉลี่ย</li><li>เฝ้าดูจำนวน error ใน log เป็นสัญญาณเตือน</li><li>วัดจุดหักใหม่ในสภาพแวดล้อมของตัวเองเสมอ อย่ายกตัวเลข 75% ไปใช้ตรง ๆ</li></ul>`,

{id:'sm-swot',k:'สรุป · 03',t:'SWOT',h:`<h3>วิเคราะห์การปฏิบัติงาน</h3>
<div class="swot"><div><b>Strength · จุดแข็ง</b><ul><li>ได้ลงมือกับงานจริง 3 แบบ ทั้งระบบใช้งานจริง งานวิจัย และแล็บตรวจจับ</li><li>มีวินัยก่อนแตะระบบจริง คือตรวจ diff สำรองข้อมูล และมีแผนถอยกลับ</li><li>มองงานแบบผู้โจมตี จึงเจอจุดอย่าง IDOR และ path traversal</li></ul></div>
<div><b>Weakness · จุดอ่อน</b><ul><li>ต้องเรียนเครื่องมือใหม่หลายตัวในเวลา 16 สัปดาห์ เช่น FastAPI, Docker Compose, LIFF, tc/netem, Wazuh</li><li>ประสบการณ์ดูแลระบบ production ยังน้อย จึงต้องพึ่งการสอบทานจากพี่เลี้ยง</li></ul></div>
<div><b>Opportunity · โอกาส</b><ul><li>ต่อยอดปิดความเสี่ยงที่เหลือใน AtTime และเปิด LIFF ระยะสอง</li><li>มีผลงานที่ตรวจสอบได้ (PR, deploy, บทความ) เป็นพอร์ตโฟลิโอ</li><li>ต่อยอดสู่สาย Security Analyst หรือ DevSecOps</li></ul></div>
<div><b>Threat · อุปสรรค</b><ul><li>ข้อมูลและโค้ดบางส่วนเปิดเผยได้จำกัด</li><li>ภัยคุกคามและเทคโนโลยี AI เปลี่ยนเร็ว ต้องเรียนรู้ต่อเนื่อง</li><li>ถ้า AtTime มีผู้ใช้จริงเพิ่ม ความเสี่ยงที่ยังเปิดอยู่จะรุนแรงขึ้น จึงต้องจัดลำดับปิดก่อนส่งมอบ</li></ul></div></div>`},

];
const SEQ=[];TABS.forEach((t,i)=>t.secs.forEach((s,j)=>SEQ.push([i,j])));
const seqIdx=(ti,si)=>SEQ.findIndex(x=>x[0]===ti&&x[1]===si);
const SECLOC={};TABS.forEach((t,i)=>t.secs.forEach((s,j)=>SECLOC[s.id]=[i,j]));
const TABLOC={root:[0,0],intro:[0,0],attime:[1,0],aintec:[2,0],wazuh:[3,0]};

let ti=-1, si=0;

/* ============ PANEL ============ */
const tabsEl=$('#tabs'), snav=$('#snav'), pbody=$('#body');
const anim=(el,o)=>{ if(RM||!el.animate)return; el.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards',...o}) };
TABS.forEach((t,i)=>{
  const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.style.setProperty('--c',t.col);b.textContent=t.name;b.onclick=()=>go(i,0);tabsEl.appendChild(b);t.btn=b;
});
function buildSnav(t){
  snav.innerHTML='';
  t.secs.forEach((s,j)=>{const b=document.createElement('button');b.className='sp';b.setAttribute('role','tab');b.textContent=s.t;b.onclick=()=>go(ti,j);snav.appendChild(b);s.btn=b});
}
function renderBody(t,s){
  $('#pk').textContent=s.k||t.k; $('#pt').textContent=s.id==='root'?t.title:s.t;
  pbody.innerHTML=s.h; pbody.scrollTop=0;
  pbody.querySelectorAll('img').forEach(i=>{i.decoding='async'});
  anim($('#pk'),{delay:30});anim($('#pt'),{delay:70});
  [...pbody.children].forEach((c,i)=>anim(c,{delay:140+i*55}));
  pbody.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count; if(RM||!to)return; const t0=performance.now();
    const tick=now=>{const k=Math.min(1,(now-t0)/1000),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e).toLocaleString('en-US');if(k<1&&el.isConnected)requestAnimationFrame(tick)};
    el.textContent='0';requestAnimationFrame(tick);
  });
}
function go(i,j=0){
  i=Math.max(0,Math.min(TABS.length-1,i)); const t=TABS[i]; j=Math.max(0,Math.min(t.secs.length-1,j));
  const tabChanged=i!==ti; ti=i; si=j;
  document.documentElement.style.setProperty('--nc',t.col);
  if(tabChanged){
    TABS.forEach(x=>x.btn.setAttribute('aria-selected',x===t?'true':'false'));
    buildSnav(t); anim(snav,{delay:60}); closeCard();
    B.dataset.island=t.island?'1':'0'; gl.focusTab(t);
    t.btn.scrollIntoView({inline:'center',block:'nearest',behavior:RM?'auto':'smooth'});
  }
  t.secs.forEach((s,k)=>s.btn.setAttribute('aria-selected',k===j?'true':'false'));
  t.secs[j].btn.scrollIntoView({inline:'center',block:'nearest',behavior:RM?'auto':'smooth'});
  renderBody(t,t.secs[j]);
  const n=seqIdx(i,j);
  $('#stepc').textContent=`${n+1} / ${SEQ.length}`;
  $('#prog i').style.width=((n+1)/SEQ.length*100)+'%'; $('#prog i').style.background=t.col;
  $('#pprev').disabled=n===0; $('#pnext').disabled=n===SEQ.length-1;
  const nx=SEQ[n+1],pv=SEQ[n-1];
  $('#pnext').textContent=nx?(nx[0]!==i?TABS[nx[0]].name+' →':'ถัดไป →'):'จบแล้ว';
  $('#pprev').textContent=pv?(pv[0]!==i?'← '+TABS[pv[0]].name:'← ก่อนหน้า'):'← ก่อนหน้า';
}
function step(d){const n=seqIdx(ti,si)+d;if(n<0||n>=SEQ.length)return;go(SEQ[n][0],SEQ[n][1])}
$('#pprev').onclick=()=>step(-1);$('#pnext').onclick=()=>step(1);
pbody.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const id=g.dataset.go,l=TABLOC[id]||SECLOC[id];if(l)go(l[0],l[1]);return}
  const im=e.target.closest('.ph img');if(im)openLb(im);
});
$('#cbody').addEventListener('click',e=>{const im=e.target.closest('.ph img');if(im)openLb(im)});

/* ---- component card ---- */
const card=$('#card');
function openCard(n,col){
  $('#ck').textContent=n.info.k; $('#ct').textContent=n.info.t||n.label; $('#cbody').innerHTML=n.info.h;
  card.style.setProperty('--cc',col); card.hidden=false; B.dataset.card='1'; card.scrollTop=0;
  [...$('#cbody').children].forEach((c,i)=>anim(c,{delay:80+i*50}));
}
function closeCard(){card.hidden=true;B.dataset.card='0';gl.select(null)}
$('#cclose').onclick=closeCard;

/* ---- lightbox ---- */
const lb=$('#lb'),lbi=lb.querySelector('img'),lbp=lb.querySelector('p');
function openLb(im){lbi.src=im.currentSrc||im.src;lbi.alt=im.alt;lbp.textContent=im.alt;lb.classList.add('on')}
lb.onclick=()=>lb.classList.remove('on');

addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const onBtn=e.target&&e.target.tagName==='BUTTON';
  if(e.key==='Escape'){if(lb.classList.contains('on'))lb.classList.remove('on');else if(!card.hidden)closeCard();return}
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();step(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}
  else if(e.key===' '&&!onBtn){e.preventDefault();gl.togglePlay&&gl.togglePlay()}
  else if(e.key==='Home'){e.preventDefault();go(0,0)}
});

/* ============ 3D ============ */
function initGL(){
  const cv=$('#gl'), labelsEl=$('#labels');
  const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:'high-performance'});
  renderer.setClearColor(0,0); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0xe4ecf5,180,520);
  const FOV=38, cam=new THREE.PerspectiveCamera(FOV,1,.5,900);
  const V=(x,y,z)=>new THREE.Vector3(x,y,z), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
  const easeBack=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
  const wrapPi=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
  let W=1,H=1;

  /* lights + ground */
  scene.add(new THREE.HemisphereLight(0xffffff,0xb8c8da,2.4));
  const sun=new THREE.DirectionalLight(0xffffff,2.6); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-48,right:48,top:48,bottom:-48,near:1,far:200}); sun.shadow.bias=-.0004; sun.shadow.radius=3;

    else{view={kind:'overview'};fbar.hidden=true;$('#reset').hidden=true;ISL.forEach(i=>i.playing=false)}
    ISL.forEach(i=>i.focus=(view.kind==='island'&&view.isl===i));

  };
  $('#reset').onclick=()=>{aim(false)};

  /* ---- pointer ---- */
  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let drag=null,pointers=new Map(),pinch=0;
  function pickAt(e){const r=cv.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
    const list=pick.filter(o=>o.userData.n?o.userData.n.q>.5:true);const x=ray.intersectObjects(list,false);if(!x.length)return null;
    const o=x[0].object;return o.userData.n?{n:o.userData.n,isl:o.userData.n.isl}:{isl:o.userData.isl}}
  cv.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);drag={m:0};cv.classList.add('drag');if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});
  cv.addEventListener('pointermove',e=>{
    const pv=pointers.get(e.pointerId);
    if(pv&&drag){
      if(pointers.size===2){pv.x=e.clientX;pv.y=e.clientY;const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)zoomMul=clamp(zoomMul*pinch/d,.4,2);pinch=d;drag.m+=10;return}
      const dx=e.clientX-pv.x,dy=e.clientY-pv.y;pv.x=e.clientX;pv.y=e.clientY;drag.m+=Math.abs(dx)+Math.abs(dy);
      const lim=view.kind==='island'?1.0:3.2;D.yaw=clamp(D.yaw-dx*.006,(view.kind==='island'?.16:0)-lim,(view.kind==='island'?.16:0)+lim);D.pitch=clamp(D.pitch+dy*.005,.28,1.3);lastInt=t;return}
    const h=pickAt(e);cv.classList.toggle('pick',!!h);ISL.forEach(i=>i.nodes.forEach(n=>n.hov=(h&&h.n===n)?1:0));
  });
  const endP=e=>{const m=drag?drag.m:99;pointers.delete(e.pointerId);if(pointers.size<2)pinch=0;if(pointers.size===0){drag=null;cv.classList.remove('drag')}
    if(e.type==='pointerup'&&m<6){const h=pickAt(e);if(h){if(h.n)selectNode(h.isl,h.n,false);else if(view.kind!=='island'||view.isl!==h.isl)go(h.isl.tab,0)}}};
  cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
  cv.addEventListener('wheel',e=>{e.preventDefault();zoomMul=clamp(zoomMul*(1+e.deltaY*.0012),.4,2);lastInt=t},{passive:false});

  /* ---- frame ---- */
  const tmp=V(0,0,0),tmp2=V(0,0,0);let last=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000)*(window.__speed||1);last=now;t+=dt;
    // islands
    ISL.forEach((isl,ii)=>{
      isl.t=RM?99:isl.t+dt;isl.rt+=dt;isl.la+=((isl.focus?1:0)-isl.la)*(1-Math.exp(-dt*6));
      const act=isl.S.flows[isl.fi].steps[isl.fs];
      // flow timing
      if(isl.playing&&isl.focus){isl.stepT+=dt;if(isl.stepT>2.1){isl.stepT=0;isl.fs=(isl.fs+1)%isl.S.flows[isl.fi].steps.length;syncFlowUI()}}
      isl.nodes.forEach((n,i)=>{
        n.q=clamp((isl.t-i*.07)/.7,0,1);const e=easeBack(n.q);
        const wave=clamp((isl.rt-i*.05)/.5,0,1),hop=(wave>0&&wave<1)?Math.sin(wave*Math.PI)*.9:0;
        n.liftT=(isl.sel===n?.5:0)+n.hov*.25;n.lift+=(n.liftT-n.lift)*(1-Math.exp(-dt*10));
        n.grp.visible=n.q>.001;n.grp.scale.setScalar(Math.max(e,.001));n.grp.position.y=(1-easeOut(n.q))*-3+hop+n.lift;
        const stepN=isl.playing||isl.focus?(act&&isl.focus&&(isl.map[act.l].a===n||isl.map[act.l].b===n)):false;
        n.glT=(isl.sel===n||stepN)?1:0;n.gl+=(n.glT-n.gl)*(1-Math.exp(-dt*8));
        n.glow.forEach(m=>{m.emissiveIntensity=(m._b===undefined?(m._b=m.emissiveIntensity):m._b)+n.gl*.7+n.hov*.15});
        if(n.ring){n.ring.rotation.x+=dt*.6;n.disc.material.opacity=.2+n.gl*.25+.05*Math.sin(t*3)}
      });
      isl.links.forEach((l,li)=>{
        const ready=Math.min(l.a.q,l.b.q);l.prog+=(clamp((isl.t-.5-li*.06)/.8,0,1)*(ready>.3?1:0)-l.prog)*(1-Math.exp(-dt*12));
        const p=easeOut(l.prog);l.tube.visible=p>.01;l.tube.geometry.setDrawRange(0,Math.floor(p*l.idx/3)*3);l.arrow.visible=p>.97;
        const isAct=isl.focus&&act&&act.l===l.L.id;l.actT=isAct?1:0;l.act+=(l.actT-l.act)*(1-Math.exp(-dt*9));
        const dimOthers=isl.focus&&isl.playing&&!isAct?.45:1;
        l.tube.material.color.set(l.col).lerp(hexToC(isl.col),l.act*.6);l.tube.material.emissive.set(l.col).lerp(hexToC(isl.col),l.act);l.tube.material.emissiveIntensity=.05+l.act*.8;
        l.tube.material.opacity=(l.L.dash?.55:.95)*(isl.focus&&isl.playing&&!isAct?.5:1);
        l.tube.scale.setScalar(1);l.arrow.material.color.copy(l.tube.material.color);
        // ambient dot
        l.dot.visible=p>.99;if(l.dot.visible){const u=(t*l.sp+l.off)%1;l.curve.getPoint(u,tmp);l.dot.position.copy(tmp);l.dot.scale.setScalar(.14*(isl.focus?1:.8))}
        if(l.el){l.el.style.opacity=0}
      });
      // flow packet
      const L=isl.map[act.l];
      if(isl.focus&&(isl.playing||isl.stepT>0)){const u=easeOut(clamp(isl.stepT/1.0,0,1));L.curve.getPoint(u,tmp);isl.pk.position.copy(tmp);isl.pkg.position.copy(tmp);isl.pk.visible=isl.pkg.visible=true;isl.pk.scale.setScalar(.34+.06*Math.sin(t*10))}
      else isl.pk.visible=isl.pkg.visible=false;
      // selection ring
      if(isl.sel){const n=isl.sel;isl.sring.visible=true;isl.sring.position.set(n.x,.15+n.lift*0,n.z);isl.sring.scale.setScalar(n.rad+.8+.12*Math.sin(t*3))}else isl.sring.visible=false;
    });
    // core + connectors
    orb.rotation.y+=dt*.3;gring.rotation.y+=dt*.5;gring2.rotation.z-=dt*.4;
    conns.forEach(c=>{c.dots.forEach(d=>{const u=(t*.12+d.o)%1;c.curve.getPoint(u,tmp);d.d.position.copy(tmp)})});
    // camera
    if(view.kind==='overview'&&!RM&&t-lastInt>4&&!drag)D.yaw+=dt*.02*Math.sin(t*.1);
    const k=1-Math.exp(-dt*(RM?30:2.7));
    C.t.lerp(D.t,k);C.dist+=(D.dist*zoomMul-C.dist)*k;C.yaw+=(D.yaw-C.yaw)*k;C.pitch+=(D.pitch-C.pitch)*k;C.sx+=(D.sx-C.sx)*k;C.sy+=(D.sy-C.sy)*k;swoop*=Math.exp(-dt*2.2);
    const yaw=C.yaw+(RM?0:Math.sin(t*.25)*.035),pitch=C.pitch+(RM?0:Math.sin(t*.2)*.012),dd=C.dist*(1+swoop*.08);
    cam.position.set(C.t.x+dd*Math.sin(yaw)*Math.cos(pitch),C.t.y+dd*Math.sin(pitch),C.t.z+dd*Math.cos(yaw)*Math.cos(pitch));cam.lookAt(C.t);
    cam.setViewOffset(W,H,C.sx,C.sy,W,H);cam.updateMatrixWorld();
    sun.position.set(C.t.x-22,50,C.t.z+30);sun.target.position.copy(C.t);
    // labels
    const half=Math.tan(FOV*Math.PI/360);
    const project=(v,out)=>{out.copy(v).project(cam);return out.z<1&&Math.abs(out.x)<1.3&&Math.abs(out.y)<1.3?[(out.x*.5+.5)*W,(-out.y*.5+.5)*H]:null};
    const wv=V(0,0,0);
    ISL.forEach(isl=>{
      isl.nodes.forEach(n=>{
        n.grp.getWorldPosition(wv);wv.y+=n.top+.55;const p=project(wv,tmp);const el=n.el,a=isl.la*clamp((n.q-.4)*2,0,1);
        if(!p||a<.03){el.style.opacity=0;el.style.pointerEvents='none';return}
        el.style.transform=`translate3d(${p[0]}px,${p[1]}px,0) translate(-50%,-100%)`;el.style.opacity=a;el.style.pointerEvents=a>.5?'auto':'none';
        el.style.zIndex=Math.round(1000-cam.position.distanceTo(wv));el.classList.toggle('on',isl.sel===n);el.classList.toggle('hot',n.hov>.5);
      });
      isl.zones.forEach(z=>{isl.group.localToWorld(wv.copy(z.pos));const p=project(wv,tmp);if(!p||isl.la<.03){z.el.style.opacity=0;return}z.el.style.transform=`translate3d(${p[0]}px,${p[1]}px,0)`;z.el.style.opacity=isl.la*.9});
      isl.links.forEach(l=>{if(!l.el)return;isl.group.localToWorld(l.curve.getPoint(.5,wv));const p=project(wv,tmp);if(!p||isl.la<.03||l.prog<.9){l.el.style.opacity=0;return}l.el.style.transform=`translate3d(${p[0]}px,${p[1]}px,0) translate(-50%,-50%)`;l.el.style.opacity=isl.la});
      // island title
      wv.set(isl.S.center[0]+isl.cx,13,isl.S.center[2]+isl.cz);const p=project(wv,tmp),a=(1-isl.la)*clamp((isl.t+.6)*1.2,0,1);
      if(!p||a<.03){isl.il.style.opacity=0;isl.il.style.pointerEvents='none'}else{isl.il.style.transform=`translate3d(${p[0]}px,${p[1]}px,0) translate(-50%,-100%)`;isl.il.style.opacity=a;isl.il.style.pointerEvents='auto'}
    });
    {wv.set(0,9.5,0);const p=project(wv,tmp),a=view.kind==='overview'?1:.0;if(!p||a<.03){coreLabel.style.opacity=0;coreLabel.style.pointerEvents='none'}else{coreLabel.style.transform=`translate3d(${p[0]}px,${p[1]}px,0) translate(-50%,-100%)`;coreLabel.style.opacity=a;coreLabel.style.pointerEvents='auto'}}
    renderer.render(scene,cam);
  }
  resize();aim(true);C.dist=D.dist*1.5;C.pitch=1.15;
  requestAnimationFrame(frame);
  window.__dbg={ISL,C,D,cam,get view(){return view}};
}
